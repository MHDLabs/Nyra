name = "nyra"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# One-click deploy: press the "Deploy to Cloudflare" button in the README.
# The Cloudflare deploy flow prompts for TELEGRAM_BOT_TOKEN, TELEGRAM_SECRET,
# ENCRYPTION_KEY and ADMIN_IDS, and provisions D1, KV and the queue
# automatically. Nothing is generated or derived — all three secrets must be
# provided by you (see the README for the openssl commands that generate them).

# Expose the Worker on https://nyra.<your-subdomain>.workers.dev so it works
# without any custom domain.
workers_dev = true

[triggers]
# Self-healing (part of the zero-manual-setup flow): the scheduled handler
# re-verifies the Telegram webhook registration and runs the KV-gated
# schema/maintenance probe every 5 minutes. Cheap when nothing is due;
# uses 1 of the 5 cron triggers allowed per account on the free plan.
crons = ["*/5 * * * *"]

# Secrets — ALL THREE ARE MANDATORY and must be set manually; nothing is derived
# from the bot token. Set them with `wrangler secret put <NAME>` (never commit
# them here) or as inputs to the Deploy to Cloudflare flow:
#   TELEGRAM_BOT_TOKEN  — bot token from @BotFather
#   TELEGRAM_SECRET     — webhook secret token; also the X-Setup-Secret header
#                         for /setup. Generate: openssl rand -hex 32
#   ENCRYPTION_KEY      — base64-encoded 32-byte master key that wraps every
#                         stored API key. Generate: openssl rand -base64 32
# The Worker refuses every request (HTTP 500 "Server misconfigured") when any of
# the three is missing, blank, or malformed — see validateSecrets() in src/crypto.js.

[vars]
# REQUIRED — the second deploy-flow prompt: comma-separated numeric Telegram
# user IDs with admin access (e.g. ADMIN_IDS = "123456789"). Non-numeric
# entries are ignored; GET / warns until at least one valid ID is set.
ADMIN_IDS = ""

# D1 database — no database_id on purpose: Wrangler's automatic provisioning
# creates the database on `wrangler deploy` and writes its ID back into this
# file (bindings without resource IDs are auto-provisioned by Wrangler).
# If you already have a deployed instance, KEEP your existing database_id here.
[[d1_databases]]
binding = "DB"
database_name = "nyra"

# KV namespace — auto-provisioned the same way on deploy.
# If you already have a deployed instance, KEEP your existing id here.
[[kv_namespaces]]
binding = "KV"

# Workers AI — available on all plans (generous free tier)
# Used exclusively for reaction classification (sentiment analysis)
[ai]
binding = "AI"

# Queue: the Telegram webhook acks immediately and hands every update to this
# queue. The consumer runs the full AI pipeline with the long wall time that
# queue invocations allow (a webhook request itself would be capped at 30s of
# post-response work via ctx.waitUntil).
[[queues.producers]]
binding = "NYRA_QUEUE"
queue = "nyra-updates"

[[queues.consumers]]
queue = "nyra-updates"
max_retries = 3
max_batch_size = 10
max_batch_timeout = 5
dead_letter_queue = "nyra-updates-dlq"

# Dead-letter queue for permanently failed updates (after 3 retries)
[[queues.producers]]
binding = "NYRA_DLQ"
queue = "nyra-updates-dlq"

[[queues.consumers]]
queue = "nyra-updates-dlq"
max_batch_size = 10
max_batch_timeout = 30
