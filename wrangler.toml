name = "nyra"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# One-click deploy: press the "Deploy to Cloudflare" button in the README.
# The Cloudflare deploy flow prompts for Telegram credentials, the central AI
# API key/model, and admin IDs, and provisions D1, KV and the queue automatically.

# Expose the Worker on https://nyra.<your-subdomain>.workers.dev so it works
# without any custom domain.
workers_dev = true

# Smart Placement moves execution to the data center closest to the backend the
# Worker talks to. Every real request here ends in an outbound call to the AI
# provider, and some providers (Groq among them) reject requests originating from
# certain networks. Running next to the provider instead of next to the visitor
# keeps the provider hop on a provider-friendly egress path, which matters most
# for visitors connecting from regions where the provider is filtered.
[placement]
mode = "smart"

# Static assets are retained for the standalone web admin panel under
# ./public/admin-panel. The application root is intentionally not a Mini App;
# only admin paths are routed through the Worker before asset serving.
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/", "/webhook", "/setup", "/status", "/admin-panel", "/admin-panel/*", "/admin-api/*"]

[triggers]
# Self-healing (part of the zero-manual-setup flow): the scheduled handler
# re-verifies the Telegram webhook registration and runs the KV-gated
# schema/maintenance probe every 5 minutes. Cheap when nothing is due;
# uses 1 of the 5 cron triggers allowed per account on the free plan.
crons = ["*/5 * * * *"]

# Required secrets (never commit actual values):
#   TELEGRAM_BOT_TOKEN — Telegram bot token from @BotFather
#   TELEGRAM_SECRET — random webhook secret; also the X-Setup-Secret header for /setup
#   AI_API_KEY — central OpenAI-compatible API credential
# AI_MODEL and AI_BASE_URL are plain Worker variables in [vars].

[vars]
# REQUIRED — the second deploy-flow prompt: comma-separated numeric Telegram
# user IDs with admin access (e.g. ADMIN_IDS = "123456789"). Non-numeric
# entries are ignored; GET /status warns until at least one valid ID is set.
ADMIN_IDS = "7141112393"
AI_MODEL = ""
AI_BASE_URL = "https://api.openai.com/v1"
AI_SUPPORTS_VISION = "false"

# D1 database — no database_id on purpose: Wrangler's automatic provisioning
# creates the database on `wrangler deploy` and writes its ID back into this
# file (bindings without resource IDs are auto-provisioned by Wrangler).
# If you already have a deployed instance, KEEP your existing database_id here.
[[d1_databases]]
binding = "DB"
database_name = "nyra"
database_id = "2173aded-26b0-45f0-98b9-71ee1b39a18d"

# KV namespace — auto-provisioned the same way on deploy.
# If you already have a deployed instance, KEEP your existing id here.
[[kv_namespaces]]
binding = "KV"
id = "9e7579fee18e45a2865a1e4bf5495b99"

# Queue: the Telegram webhook acks immediately and hands every update to this
# queue. The consumer runs the full AI pipeline with the long wall time that
# queue invocations allow (a webhook request itself would be capped at 30s of
# post-response work via ctx.waitUntil).
[[queues.producers]]
binding = "NYRA_QUEUE"
queue = "nyra-updates"

[[queues.consumers]]
queue = "nyra-updates"
max_retries = 3
max_batch_size = 10
# A message waits at most 1s for company before the batch ships. The consumer
# runs same-chat messages in order and different chats in parallel, so a larger
# batch buys no throughput — it only adds latency for the first message.
max_batch_timeout = 1
# One concurrent consumer: prevents two batches for the same chat from
# interleaving (Queues has no per-chat group key on this plan).
max_concurrency = 1
dead_letter_queue = "nyra-updates-dlq"

# Dead-letter queue for permanently failed updates (after 3 retries)
[[queues.producers]]
binding = "NYRA_DLQ"
queue = "nyra-updates-dlq"

[[queues.consumers]]
queue = "nyra-updates-dlq"
max_batch_size = 10
max_batch_timeout = 30
