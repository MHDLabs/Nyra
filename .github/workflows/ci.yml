name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "maintenance/**", "migration/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Install, typecheck, test, dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Typecheck Worker
        run: npm run typecheck:worker

      - name: Typecheck Web
        run: npm run typecheck:web

      - name: Typecheck (aggregate)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: TypeScript smoke tests
        run: npm run test:ts

      - name: Full test suite
        run: npm run test:all

      - name: Wrangler deploy dry-run
        run: ./node_modules/.bin/wrangler deploy --dry-run
