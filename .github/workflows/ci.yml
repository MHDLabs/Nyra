name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check (src)
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Syntax check (test)
        run: |
          find test -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: node --test test/*.test.js

      - name: Dependency audit (non-blocking summary)
        run: npm audit --audit-level=high || true
