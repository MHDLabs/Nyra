name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "maintenance/**", "migration/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test:all

      - name: Wrangler dry-run
        run: ./node_modules/.bin/wrangler deploy --dry-run

  deploy:
    name: Deploy Worker (OTA)
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    steps:
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Missing Cloudflare secrets — skip deploy."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: steps.creds.outputs.present == 'true'
        env:
          npm_config_registry: "https://registry.npmjs.org"
          npm_config_fund: "false"
          npm_config_audit: "false"
          npm_config_fetch_timeout: "120000"
          npm_config_fetch_retries: "5"
        run: |
          set -e
          npm ci --no-audit --no-fund
          ./node_modules/.bin/wrangler --version

      - name: Deploy Worker
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          SHA="${GITHUB_SHA}"
          REF="${GITHUB_REF_NAME}"
          TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Deploying Nyra@${SHA:0:7} ref=${REF} at=${TIME}"
          ./node_modules/.bin/wrangler deploy \
            --var "NYRA_BUILD_SHA:${SHA}" \
            --var "NYRA_BUILD_REF:${REF}" \
            --var "NYRA_BUILD_TIME:${TIME}" \
            --var "NYRA_BUILD_SOURCE:github-actions"

      - name: Probe /status
        if: steps.creds.outputs.present == 'true'
        run: curl -fsS --max-time 20 "https://nyra.mhdlabs.workers.dev/status" || true
        continue-on-error: true
