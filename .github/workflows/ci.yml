name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Tests use only Node builtins + repo source — skip npm ci.
      # Full wrangler install is reserved for the Deploy workflow.
      - name: Syntax check (src)
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Syntax check (test)
        run: find test -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: node --test test/*.test.js
