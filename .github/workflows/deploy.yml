# OTA deploy — push to main ships this Worker.
# Avoid full optional dependency tree (sharp etc.): npm was hanging on Actions
# with "Exit handler never called".

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pre-deploy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: find src test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Unit tests
        run: node --test test/*.test.js

  deploy:
    name: Deploy Worker (OTA)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Missing Cloudflare secrets — skip deploy."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: "22"

      - name: Install Wrangler (no optional deps)
        if: steps.creds.outputs.present == 'true'
        env:
          npm_config_optional: "false"
          npm_config_fund: "false"
          npm_config_audit: "false"
          npm_config_progress: "false"
          npm_config_fetch_timeout: "60000"
          npm_config_fetch_retries: "2"
        run: |
          set -e
          # --omit=optional skips sharp/platform binaries that hang npm on GHA
          npm install --no-save --ignore-scripts --omit=optional wrangler@4.42.0
          ./node_modules/.bin/wrangler --version

      - name: Deploy Worker
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          SHA="${GITHUB_SHA}"
          SHORT="$(echo "$SHA" | cut -c1-7)"
          TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REF="${GITHUB_REF_NAME}"
          echo "Deploying Nyra@$SHORT ref=$REF at=$TIME"
          ./node_modules/.bin/wrangler deploy \
            --var "NYRA_BUILD_SHA:${SHA}" \
            --var "NYRA_BUILD_REF:${REF}" \
            --var "NYRA_BUILD_TIME:${TIME}" \
            --var "NYRA_BUILD_SOURCE:github-actions"

      - name: Probe /status
        if: steps.creds.outputs.present == 'true'
        run: curl -fsS --max-time 20 "https://nyra.mhdlabs.workers.dev/status" || true
        continue-on-error: true
