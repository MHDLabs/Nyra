# OTA deploy — push to main ships this Worker via cloudflare/wrangler-action.
# Does NOT use npm install of wrangler (npm was hanging on Actions with
# "Exit handler never called" while resolving optional sharp deps).
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — Workers Scripts Edit + Account Read
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is this manual deploy running?"
        required: false
        default: "manual"

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pre-deploy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: find src test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Unit tests
        run: node --test test/*.test.js

  deploy:
    name: Deploy Worker (OTA)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping deploy."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'

      - name: Deploy with Wrangler action
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pin a recent wrangler; the action installs it without our broken npm ci path.
          wranglerVersion: "4.42.0"
          command: >
            deploy
            --var NYRA_BUILD_SHA:${{ github.sha }}
            --var NYRA_BUILD_REF:${{ github.ref_name }}
            --var NYRA_BUILD_TIME:${{ github.event.head_commit.timestamp || github.run_started_at }}
            --var NYRA_BUILD_SOURCE:github-actions

      - name: Post-deploy status probe (best-effort)
        if: steps.creds.outputs.present == 'true'
        run: |
          set +e
          echo "Deploy step finished. Probe /status for Build SHA."
          curl -fsS --max-time 15 "https://nyra.mhdlabs.workers.dev/status" || true
        continue-on-error: true
