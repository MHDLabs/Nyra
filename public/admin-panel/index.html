<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Nyra Admin Panel</title>
  <link rel="stylesheet" href="/admin-panel/styles.css" />
</head>
<body>
  <div id="login-view" class="view">
    <div class="glass login-card">
      <div class="brand">
        <div class="logo">N</div>
        <h1>NYRA</h1>
        <div class="sub">ADMIN</div>
        <p class="muted" style="margin:6px 0 0;letter-spacing:0;font-size:0.9rem">پنل مدیریت خارج از تلگرام</p>
      </div>
      <div class="status-pill"><span class="dot"></span> آماده</div>
      <form id="login-form">
        <label>رمز عبور پنل</label>
        <input type="password" id="password" autocomplete="current-password" required placeholder="ADMIN_PANEL_PASSWORD" />
        <button type="submit" class="btn primary">ورود به پنل</button>
        <p id="login-error" class="error" hidden></p>
      </form>
      <div class="theme-row">
        <button type="button" class="btn ghost" data-theme="light">☀ روشن</button>
        <button type="button" class="btn ghost" data-theme="dark">☾ تیره</button>
      </div>
    </div>
  </div>

  <div id="app-view" class="view" hidden>
    <header class="glass topbar">
      <div class="brand small">
        <div class="logo" style="width:40px;height:40px;border-radius:14px;font-size:1rem">N</div>
        <div>
          <strong style="display:block;color:var(--text-strong)">Nyra Admin</strong>
          <span class="muted" style="font-size:0.75rem">مدیریت کاربران و گفتگوها</span>
        </div>
      </div>
      <div class="top-actions">
        <span id="stats"></span>
        <button type="button" class="btn ghost" data-theme-toggle title="تغییر تم">☾</button>
        <button type="button" class="btn danger" id="logout-btn">خروج</button>
      </div>
    </header>

    <main class="layout">
      <section id="tab-users" class="tab active">
        <div class="panel list-panel">
          <div class="panel-head"><h2>کاربران</h2></div>
          <input type="search" id="user-search" placeholder="جستجو نام / یوزرنیم / id" style="margin-bottom:12px" />
          <div id="user-list" class="list"></div>
        </div>
        <div class="panel detail-panel" id="user-detail">
          <p class="muted center">یک کاربر را انتخاب کنید</p>
        </div>
      </section>

      <section id="tab-groups" class="tab">
        <div class="panel list-panel">
          <div class="panel-head"><h2>گروه‌ها</h2></div>
          <div id="group-list" class="list"></div>
        </div>
        <div class="panel detail-panel" id="group-detail">
          <p class="muted center">یک گروه را انتخاب کنید</p>
        </div>
      </section>

      <section id="tab-models" class="tab">
        <div class="panel full">
          <div class="panel-head"><h2>مدل‌ها و کانکشن‌ها</h2></div>
          <div id="model-list" class="cards"></div>
        </div>
      </section>

      <section id="tab-broadcast" class="tab">
        <div class="panel full narrow">
          <div class="panel-head"><h2>ارسال پیام</h2></div>
          <form id="send-form" class="stack">
            <label>هدف</label>
            <select id="send-target">
              <option value="one">یک کاربر (telegram_id)</option>
              <option value="all">همه کاربران (غیرمسدود)</option>
            </select>
            <input type="text" id="send-id" placeholder="telegram_id" />
            <label>متن پیام</label>
            <textarea id="send-text" rows="5" placeholder="متن پیام..."></textarea>
            <button type="submit" class="btn primary">ارسال پیام</button>
            <p id="send-result" class="muted"></p>
          </form>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" id="bottom-nav">
      <button type="button" data-tab="users" class="active"><span class="ico">👤</span>کاربران</button>
      <button type="button" data-tab="groups"><span class="ico">👥</span>گروه‌ها</button>
      <button type="button" data-tab="models"><span class="ico">✦</span>مدل‌ها</button>
      <button type="button" data-tab="broadcast"><span class="ico">✈</span>ارسال</button>
    </nav>
  </div>

  <script src="/admin-panel/app.js"></script>
</body>
</html>
