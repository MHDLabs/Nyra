<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Nyra AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css">
  <link rel="stylesheet" href="/styles.css?v=20261108">
</head>
<body>
  <canvas id="space-canvas" aria-hidden="true"></canvas>
  <div class="glass-orb glass-orb-a" aria-hidden="true"></div>
  <div class="glass-orb glass-orb-b" aria-hidden="true"></div>

  <div id="app">
    <div id="loading">
      <div class="spinner"></div>
      <span id="loading-text">Loading Nyra...</span>
    </div>

    <div id="shell" class="hidden">
      <header class="header glass-panel">
        <div class="logo">
          <div class="logo-icon"></div>
          <span>Nyra <span id="user-name"></span></span>
        </div>
        <div class="header-actions">
          <button id="lang-btn" class="icon-btn" type="button" title="Change language" aria-label="Change language">🌐</button>
          <button id="theme-btn" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">🌓</button>
        </div>
      </header>

      <nav class="tabs glass-panel" id="tabs-container" role="tablist" aria-label="Sections"></nav>

      <main class="content">
        <div id="sec-models" class="section active" role="tabpanel"></div>
        <div id="sec-automations" class="section" role="tabpanel"></div>
        <div id="sec-routing" class="section" role="tabpanel"></div>
        <div id="sec-preferences" class="section" role="tabpanel"></div>
        <div id="sec-usage" class="section" role="tabpanel"></div>
        <div id="sec-admin" class="section" role="tabpanel"></div>
      </main>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal-root" class="modal-root hidden" aria-hidden="true"></div>

  <script src="/app.js?v=20261108"></script>
</body>
</html>
